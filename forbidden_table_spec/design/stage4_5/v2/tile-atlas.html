const honors={E:'East',S:'South',WEST:'West',N:'North',R:'Red',G:'Green',W:'White'};const rows=document.getElementById('face-rows');rows.style.display='flex';rows.style.flexDirection='column';rows.style.gap='8px';for(const [suit,label]of [['CHR','Characters'],['DOT','Circles'],['BAM','Bamboo'],['HON','Honors']]){const row=document.createElement('div');row.className='face-row';const heading=document.createElement('strong');heading.textContent=label;row.append(heading);for(const a of window.FT_V2.chineseTiles.assets.filter(a=>a.suit===suit)){const button=document.createElement('button');button.className='catalog-face';button.setAttribute('aria-label',a.honor||label+' '+a.rank);const img=document.createElement('img');img.src='assets/chinese-tiles/'+a.file;img.alt='';img.draggable=false;const name=document.createElement('span');name.textContent=suit==='HON'?honors[a.rank]:a.rank;button.append(img,name);row.append(button);}rows.append(row);}
